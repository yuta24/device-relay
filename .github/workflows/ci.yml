name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: relay CLI (${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each image carries one major Xcode version.
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest Xcode on the image
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun swift --version
      - name: Build
        run: xcrun swift build
      - name: Test
        run: xcrun swift test

  runner:
    name: Runner (${{ matrix.xcode }}, simulator build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest Xcode on the image
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build the runner for the iOS simulator
        run: |
          xcodebuild build-for-testing \
            -project Runner/RelayRunner.xcodeproj -scheme RelayRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
