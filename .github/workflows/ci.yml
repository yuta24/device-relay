name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: relay CLI (${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each image carries one major Xcode version.
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up coverage tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
      # The image's default Xcode: a release, where the newest one installed may be a release candidate.
      - name: Show the Xcode in use
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build
        run: xcrun swift build
      - name: Test
        # In parallel, which takes about 5 seconds here. The limit ends a test that hangs: the hosted runners
        # have 3 CPUs, so three tests that block their threads waiting for each other can stop the whole run.
        run: xcrun swift test --enable-code-coverage
        timeout-minutes: 10
      - name: Check coverage
        run: |
          mise exec -- python3 -m unittest discover -s scripts -p 'test_*.py'
          coverage_path="$(xcrun swift test --show-codecov-path)"
          mise exec -- python3 scripts/coverage.py "$coverage_path" --output coverage
      - name: Save coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.image }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  runner:
    name: Runner (${{ matrix.xcode }}, simulator build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Show the Xcode in use
        run: xcodebuild -version
      - name: Build the runner for the iOS simulator
        run: |
          xcodebuild build-for-testing \
            -project Runner/RelayRunner.xcodeproj -scheme RelayRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
