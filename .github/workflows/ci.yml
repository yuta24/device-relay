name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: relay CLI (${{ matrix.xcode }})
    needs: package-changes
    if: ${{ !cancelled() }}
    env:
      RUN_CODE_CI: ${{ needs.package-changes.result != 'success' || needs.package-changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each image carries one major Xcode version.
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    # Materialize every matrix check name, using Linux for documentation-only PRs.
    runs-on: ${{ needs.package-changes.result == 'success' && needs.package-changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.image }}
    timeout-minutes: 30
    steps:
      - name: Documentation-only PR
        if: env.RUN_CODE_CI != 'true'
        run: echo "README/docs-only PR; Swift build, tests and coverage are not required."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_CODE_CI == 'true'
      - name: Set up development tools
        if: env.RUN_CODE_CI == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: --locked
      - name: Select Xcode 27.2
        if: env.RUN_CODE_CI == 'true' && matrix.image == 'xcode-27'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      # Xcode 27 matches Release; Xcode 26 retains the image's default stable version.
      - name: Show the Xcode in use
        if: env.RUN_CODE_CI == 'true'
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check
        if: env.RUN_CODE_CI == 'true'
        # In parallel, which takes about 5 seconds here. The limit ends a test that hangs: the hosted runners
        # have 3 CPUs, so three tests that block their threads waiting for each other can stop the whole run.
        run: mise run check
        timeout-minutes: 10
      - name: Save coverage reports
        if: ${{ !cancelled() && env.RUN_CODE_CI == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.image }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  package-changes:
    name: Check package inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify CI inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'code=true\nrun=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  package:
    name: Release package smoke test
    needs: package-changes
    if: ${{ !cancelled() && (needs.package-changes.result != 'success' || needs.package-changes.outputs.run != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: --locked
      - name: Identify the package build toolchain
        id: toolchain
        run: |
          {
            printf '%s\n' "$DEVELOPER_DIR"
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
            sw_vers
          } > "$RUNNER_TEMP/package-toolchain.txt"
          fingerprint=$(shasum -a 256 "$RUNNER_TEMP/package-toolchain.txt" | awk '{print $1}')
          cat "$RUNNER_TEMP/package-toolchain.txt"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Swift release build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-package-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-release-arm64-x86_64-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'scripts/package.sh') }}
          restore-keys: |
            swift-package-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-release-arm64-x86_64-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Smoke-test unsigned release packages
        run: mise run test:package

  runner:
    name: Runner (${{ matrix.xcode }}, simulator build)
    needs: package-changes
    if: ${{ !cancelled() }}
    env:
      RUN_CODE_CI: ${{ needs.package-changes.result != 'success' || needs.package-changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: Xcode 27
            image: xcode-27
          - xcode: Xcode 26
            image: macos-latest
    runs-on: ${{ needs.package-changes.result == 'success' && needs.package-changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.image }}
    # Phase budgets plus normal stop, fallback cleanup, CLI build and diagnostics.
    timeout-minutes: 60
    steps:
      - name: Documentation-only PR
        if: env.RUN_CODE_CI != 'true'
        run: echo "README/docs-only PR; Runner build and simulator smoke test are not required."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_CODE_CI == 'true'
      - name: Set up development tools
        if: env.RUN_CODE_CI == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: --locked
      - name: Select Xcode 27.2
        if: env.RUN_CODE_CI == 'true' && matrix.image == 'xcode-27'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Show the Xcode in use
        if: env.RUN_CODE_CI == 'true'
        run: xcodebuild -version
      - name: Smoke-test Runner on the iOS simulator
        if: env.RUN_CODE_CI == 'true'
        run: mise run test:runner
        timeout-minutes: 55
      - name: Save Runner smoke diagnostics
        if: ${{ !cancelled() && env.RUN_CODE_CI == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-smoke-${{ matrix.image }}
          path: runner-smoke/
          if-no-files-found: warn
          retention-days: 7
