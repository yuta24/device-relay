name: mise tool updates

on:
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-tool-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check mise tool updates
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: --locked
      - name: Check for update candidates
        run: mise run tools:outdated
      - name: Save update report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-tool-updates
          path: tool-updates/
          if-no-files-found: warn
          retention-days: 30
