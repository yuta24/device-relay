[tool_config]
locked = true

[tools]
python = "3.14.3"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"github:nicklockwood/SwiftFormat" = "0.64.6"

[tasks.build]
description = "Build the CLI"
run = "xcrun swift build"

[tasks."test:swift"]
description = "Build and run Swift tests with code coverage"
run = "xcrun swift test --enable-code-coverage"

[tasks."test:python"]
description = "Run coverage reporter tests"
run = "python3 -m unittest discover -s scripts -p 'test_*.py'"

[tasks.coverage]
description = "Run Swift tests, report coverage, and enforce coverage floors"
depends = ["test:swift"]
run = '''
set -euo pipefail
coverage_path="$(xcrun swift test --show-codecov-path)"
python3 scripts/coverage.py "$coverage_path" --output coverage
'''

[tasks.check]
description = "Lint workflows/scripts, run Swift/Python tests, and enforce coverage floors"
depends = ["lint:swift", "lint:workflow", "lint:shell", "coverage", "test:python"]

[tasks.format]
description = "Format tracked Swift source directories and the package manifest"
run = "swiftformat Package.swift Sources Tests Runner --cache ignore"

[tasks."lint:swift"]
description = "Check Swift formatting without modifying files"
run = "swiftformat Package.swift Sources Tests Runner --lint --cache ignore"

[tasks."lint:workflow"]
description = "Lint GitHub Actions workflows, including embedded shell scripts"
run = "actionlint -pyflakes="

[tasks."lint:shell"]
description = "Lint release shell scripts"
run = "shellcheck scripts/*.sh"

[tasks."test:package"]
description = "Build and smoke-test unsigned arm64 and Intel release packages"
run = "bash scripts/package-smoke.sh arm64 x86_64"

[tasks."tools:outdated"]
description = "Report project tool update candidates; exit 1 when updates are available"
run = "python3 scripts/tool_updates.py"

[tasks."test:runner"]
description = "Smoke-test Runner startup, authentication, ping and cleanup on a disposable simulator"
depends = ["build"]
run = "python3 scripts/runner_smoke.py"
